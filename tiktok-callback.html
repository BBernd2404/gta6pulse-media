<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>GTA6 Pulse – TikTok Login</title>
<style>body{font-family:system-ui,sans-serif;background:#14041f;color:#fff;max-width:640px;margin:40px auto;padding:0 16px}
code{display:block;word-break:break-all;background:#2a0f3d;padding:12px;border-radius:8px;margin:12px 0}
button{background:#ff2e88;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:16px}</style></head>
<body><h1>TikTok-Anmeldung</h1><div id="out">Kein Code empfangen.</div>
<script>
const p = new URLSearchParams(location.search), out = document.getElementById("out");
if (p.get("error")) { out.textContent = "Fehler: " + p.get("error") + " " + (p.get("error_description") || ""); }
else if (p.get("code")) {
  out.textContent = "";
  const t = document.createElement("p"); t.textContent = "Code kopieren und in PowerShell eingeben (gilt nur wenige Minuten):";
  const c = document.createElement("code"); c.textContent = p.get("code");
  const b = document.createElement("button"); b.textContent = "Kopieren";
  b.onclick = () => navigator.clipboard.writeText(p.get("code")).then(() => b.textContent = "Kopiert ✓");
  out.append(t, c, b);
}
history.replaceState(null, "", location.pathname);  // Code nicht in der Browser-Historie lassen
</script></body></html>
